name = "{Projekt Warsztaty Badawcze 2}"
version = "0.1.0"
description = "Nowoczesne środowisko Python z uv, ruff i mypy"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kacper Rzeźniczak" },
{ name = "Liliana Sirko" },
{ name = "Michał Syrkiewicz" }
	
]
dependencies = []

[tool.uv]
# Definiujemy narzędzia deweloperskie osobno
dev-dependencies = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
# Ustawienia dla lintera i formatera (zastępuje Black i isort)
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E, W - błędy i ostrzeżenia pycodestyle
# F - Pyflakes (logika)
# I - isort (sortowanie importów)
# B - flake8-bugbear (częste błędy)
# UP - pyupgrade (modernizacja składni)
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# "Strict mode" to najlepsza praktyka w nowym Pythonie
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Wyłączamy błędy dla bibliotek, które nie mają wsparcia dla typów
module = "*.external_lib.*"
ignore_missing_imports = true