name = "{Projekt Warsztaty Badawcze 2}"
version = "0.1.0"
description = "Nowoczesne środowisko Python z uv, ruff i mypy"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kacper Rzeźniczak" },
{ name = "Liliana Sirko" },
{ name = "Michał Syrkiewicz" }
	
]
dependencies = []

[tool.uv]
dev-dependencies = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "*.external_lib.*"
ignore_missing_imports = true
