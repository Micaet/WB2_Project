[project]
name = "Projekt_Warsztaty_Badawcze_2"
version = "0.1.0"
description = "Impact of Data Ranking on Training Dynamics - Projekt WB2"
readme = "README.md"
requires-python = "==3.10.*"
authors = [
    { name = "Kacper Rzeźniczak" },
    { name = "Liliana Sirko" },
    { name = "Michał Syrkiewicz" }
]

# Główne zależności wymagane do uruchomienia eksperymentu
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torchaudio==2.4.1",
    "numpy==1.24.4",
    "scipy==1.11.4",
    "matplotlib==3.8.2",
    "scikit-learn>=1.5.0",
    "tqdm",
    "omegaconf",
    "pandas",
    "ipykernel",
    "transformers>=5.5.4",
    "ipywidgets>=8.1.8",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "*.external_lib.*"
ignore_missing_imports = true
